[project]
name = "unmarker-text-watermark-benchmark"
version = "0.1.0"
description = "Reproducible bilingual benchmark for text watermark rewrite strategies"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
unmarker-text-bench = "unmarker_text_bench.cli:main"
unmarker-markllm-corpus = "unmarker_text_bench.markllm_cli:main"
unmarker-remote-bench = "unmarker_text_bench.remote_cli:main"

[project.optional-dependencies]
markllm = [
  "datasets>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.46",
]
remote = [
  "transformers>=5.15,<5.16",
]
modal = [
  "modal==1.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unmarker_text_bench"]
